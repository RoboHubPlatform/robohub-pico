#
# pico2w — Raspberry Pi Pico 2W board support.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: pico2w
  type: platform-board
  version: 0.1.0
  description: >
    Board support package for the Raspberry Pi Pico 2W (RP2350).

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-06"

hardware:
  presets: presets/
  target: target.json

vendor:
  dir: ../../vendor
  repos:
    - name: pico-sdk
      path: pico-sdk
      git: https://github.com/raspberrypi/pico-sdk.git
      branch: develop

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

# What this board can be in a deployment. A Pico 2W has the radio and the buses,
# so it can measure, relay, or gateway; it has no host filesystem or container
# runtime, so it is not a `host`.
capabilities:
  gateway: true
  relay: true
  node: true
  edge: true
  host: false
  wireless: true
  ethernet: false
  links: "uart console usb wifi socket"
  buses: "uart usb i2c spi onewire gpio adc pwm"
  deploy: "flash"

# How a deployment reaches this board: it is flashed, and its image is built for
# the ARM core it carries. The target name is the board's own `module.name`.
deployment:
  kconfig: "CONFIG_RH_BOARD_PICO_2W=y"
  method: "flash"
  arch: "arm"

package:
  kind: library
  binary: false

board:
  designation: PICO_2W
  summary: "A Pico 2W: RP2350 with WiFi, a 1-Wire bus, and USB serial."
  mcu: RP2350
  family: RP2350
  core: Cortex-M33
  preset: rp2350
  target: rp2350
  connectors:
    - name: GPIO
      pins: 1-26
    - name: QWIIC
    - name: DEBUG_SWD
  programmer:
    tool: picotool
    interface: swd
    protocol: cmsis-dap
  debug_interface: swd
  flash:
    tool: elf2uf2
    command: "elf2uf2 {binary} --family-id 0xe48bff59"
  pins:
    user_led:
      gpio: 15
      active_high: true
    uart0_tx:
      gpio: 0
    uart0_rx:
      gpio: 1
    uart1_tx:
      gpio: 4
    uart1_rx:
      gpio: 5
    onewire0_dq:
      gpio: 28
    adc0_ch0:
      gpio: 26
    pwm0_ch0:
      gpio: 21
    pwm0_ch1:
      gpio: 23
    pwm0_ch2:
      gpio: 24
  peripherals:
    - name: uart0
      kind: uart
    - name: uart1
      kind: uart
    - name: i2c0
      kind: i2c
    - name: i2c1
      kind: i2c
    - name: spi0
      kind: spi
    - name: adc0
      kind: adc
    - name: onewire0
      kind: onewire
    - name: pwm0
      kind: pwm
    - name: pwm0
      kind: pwm
    - name: pwm0
      kind: pwm
metadata:
  tags:
    - board
    - pico
    - rp2350
    - robohub
  stability: experimental
  visibility: public
