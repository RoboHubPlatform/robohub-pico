# The device keystore in the last two flash sectors (src/platform/pico_keystore.c,
# cmake/pico_keystore_reserve.ld, CMakeLists.txt). Proposed until the maintainer
# approves them.
level: SUB
prefix: PICO-KEY
title: Pico keystore
requirements:
  - id: PICO-KEY-0001
    title: The keystore is the last two 4 KiB sectors of flash
    statement: >
      The keystore shall hold the A/B records of robohub/keystore_core.h in the
      last two 4 KiB sectors of the board's flash — slot A the second-to-last,
      slot B the last; 0x103FE000-0x103FFFFF on a 4 MB Pico 2W — and read them
      through the uncached, untranslated XIP window.
    rationale: Reads must see what was just programmed, and the physical sector even when the image runs from a translated partition.
    satisfies: [PICO-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore]

  - id: PICO-KEY-0002
    title: An image that reaches the keystore does not link
    statement: >
      Every link of a program with robohub-pico shall fail with a message when
      the image's end (`__flash_binary_end`) is above XIP_BASE +
      PICO_FLASH_SIZE_BYTES − 2 × 4096.
    rationale: A program grown into the keystore would have its tail erased by the next key rotation.
    satisfies: [PICO-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: demonstration
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, linker]

  - id: PICO-KEY-0003
    title: The keystore's flash size is the board's
    statement: >
      The keystore source shall refuse to compile when the flash size it uses
      differs from the board's PICO_FLASH_SIZE_BYTES.
    rationale: Otherwise the linker reservation and the sectors written would be in different places.
    satisfies: [PICO-0004]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore]

  - id: PICO-KEY-0004
    title: Flash is changed only with nothing running from it
    statement: >
      The keystore shall erase a sector and program a 256-byte page only inside
      the SDK's flash_safe_execute, waiting at most 100 ms for the other core to
      be locked out, and shall report the store as failed, not crash, when that
      lockout cannot be had.
    rationale: Erasing flash stops execute-in-place; an interrupt handler or the other core running from flash meanwhile would fault.
    satisfies: [PICO-0004]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, flash, multicore]

  - id: PICO-KEY-0005
    title: The platform's keystore is always the one linked
    statement: >
      Every program linked with robohub-pico shall take rh_keystore_load and
      rh_keystore_store from the platform's flash keystore rather than
      robohub-common's weak "no store" defaults, whatever order the archives are
      linked in.
    rationale: A board that silently linked the default would answer a rotation "cannot rotate" or lose the key at reset.
    satisfies: [PICO-0004]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, linker]
