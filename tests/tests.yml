# The tests this platform has, declared rather than discovered (see
# robohub-stm32/tests/tests.yml for the vocabulary: `kind` says who runs a suite,
# `tags` what class of test it is).

name: robohub-pico

suites:

  # The board specs' pin assignments: no GPIO claimed by two functions, none on
  # the CYW43's lines, each peripheral pin one the RP2350 can route that function
  # to, the user LED declared on the CYW43, and target.json, module.yml and the
  # board support package giving the same numbers.
  # @verifies PICO-BOARD-0003
  - name: board-pins
    kind: command
    tags: [unit, host]
    command: [python3, tests/board_pins_test.py]

  # The health contracts on the board (PICO-0010): examples/c/health_check walks
  # through a watchdog reset, a recorded HardFault and a fed watchdog, one boot
  # each, and says "health-check: passed" on its USB console. Run on a Pico 2 W
  # on 2026-11-20: boot 3, reset reason fault, code 1 in task 1 at the faulting
  # store, the watchdog fed about 100 times a second. It needs the board, so it
  # is declared skipped here.
  # @verifies PICO-0010
  - name: health-on-target
    kind: command
    command: [sh, -c, "rho build -target pico2w examples/c/health_check && rho flash -target pico2w examples/c/health_check/build/output/health_check.elf"]
    tags: [on-target, pico2w]
    status: skip
    reason: needs a Pico 2 W on USB; flash examples/c/health_check and read its console for "health-check: passed"

  # Updates over the link on the board (PICO-0011, PICO-0012):
  # examples/c/update_check/update_check.py builds three images, flashes the first
  # with the A/B partition table, updates to the second (confirmed from partition
  # B) and to the third, which hangs on trial and is rolled back. It needs the
  # board on USB, so it is declared skipped here.
  # @verifies PICO-0011, PICO-0012
  - name: update-on-target
    kind: command
    command: [python3, examples/c/update_check/update_check.py]
    tags: [on-target, pico2w, updates]
    status: skip
    reason: needs a Pico 2 W on USB (kept attached across its reboots); prints "OK" when an update was kept and another rolled back
